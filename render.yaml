# Render Blueprint: API (Docker) + static frontend + Key Value (Redis), all free.
# Service names fix the public URLs below; if Render appends a suffix to a name,
# update CORS_ORIGINS, VITE_API_BASE and VITE_WS_URL to match.
services:
  - type: web
    name: parkison-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile.prod
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Dockerfile.prod listens on 8000; tell Render to route there.
      - key: PORT
        value: "8000"
      # One worker: each loads the model and runs its own analysis queue.
      - key: UVICORN_WORKERS
        value: "1"
      - key: AUDIO_MODEL_PATH
        value: models/audio.pkl
      - key: CORS_ORIGINS
        value: https://parkison-web.onrender.com
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: parkison-redis
          property: connectionString

  - type: web
    name: parkison-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    routes:
      # Client-side routes such as /analysis/<uuid> must serve the app shell.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Baked into the bundle at build time.
      - key: VITE_API_BASE
        value: https://parkison-api.onrender.com
      - key: VITE_WS_URL
        value: wss://parkison-api.onrender.com/ws/{requestId}

  - type: keyvalue
    name: parkison-redis
    plan: free
    region: virginia
    # Empty: reachable only over Render's private network.
    ipAllowList: []
