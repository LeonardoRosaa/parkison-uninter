services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: api-prod
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.prod
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE: ${PUBLIC_API_BASE:-https://api.your-domain.com}
        VITE_WS_URL: ${PUBLIC_WS_URL:-wss://api.your-domain.com/ws/{requestId}}
        VITE_LOCALE: ${PUBLIC_LOCALE:-}
    container_name: frontend-prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4173}:4173"
    networks:
      - net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:4173 >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8.2.4-alpine3.22
    container_name: redis-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  net:
    driver: bridge

volumes:
  redis-data:
