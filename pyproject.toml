[project]
name = "parkison"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncio>=4.0.0",
    "attrs>=25.4.0",
    "authlib>=1.6.6",
    "cachetools>=6.2.4",
    "fastapi[standard]>=0.123.9",
    "httpx>=0.28.1",
    "librosa>=0.11.0",
    "load-dotenv>=0.1.0",
    "numpy>=2.3.5",
    "praat-parselmouth>=0.4.7",
    "python-multipart>=0.0.20",
    "redis>=7.2.0",
    # Pinned to the version models/audio.pkl was pickled with.
    "scikit-learn==1.7.2",
    "scipy>=1.16.3",
    "uvicorn>=0.38.0",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ruff>=0.14.10",
    "ty>=0.0.9",
]

[tool.ruff]
# analysis/ is its own project with its own tooling.
extend-exclude = ["analysis"]

[tool.ty.src]
exclude = ["analysis"]
